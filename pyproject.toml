[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fase3-fabio-gomez"
version = "2.0.0"
description = "Caja Compensandote - Control de Afiliados (UNAD Estructura de Datos 301305)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Fabio Alexmar Gomez Sanmiguel" }
]

[tool.unittest]
start-dir = "tests"
pattern = "test_*.py"
